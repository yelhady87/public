services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app                   # bind-mount source for hot reload
      - clients_data:/app/data   # named volume keeps data separate from source mount
      - ${DELTA_TENANTS_PATH:-/tmp/tenants}:/app/tenants:ro
    environment:
      - DELTA_BASE_DIR=/app/tenants
      - OAUTH_SERVER_URL=${OAUTH_SERVER_URL}
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET}
    command: uvicorn main:app --reload --host 0.0.0.0 --port 8000

volumes:
  clients_data:
